name: listago
description: 'Aplicativo de lista de compras inteligente para o mercado brasileiro.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  drift: ^2.34.1
  drift_dev: ^2.34.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3
  riverpod_generator: ^4.0.4
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
